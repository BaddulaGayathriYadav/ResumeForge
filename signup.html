<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Free Account | ResumeForge</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #08090d;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .page {
            width: 100%;
            max-width: 480px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            font-size: 30px;
            letter-spacing: -1px;
        }

        .brand span {
            color: #7c5cff;
        }

        .card {
            background: #11131a;
            border: 1px solid #242733;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .card h2 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3b4;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .free-box {
            background: rgba(124, 92, 255, 0.10);
            border: 1px solid rgba(124, 92, 255, 0.30);
            border-radius: 12px;
            padding: 13px 15px;
            margin-bottom: 24px;
            color: #d9d2ff;
            font-size: 14px;
            line-height: 1.5;
        }

        .free-box strong {
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #e5e7eb;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border-radius: 10px;
            border: 1px solid #303442;
            background: #0b0d12;
            color: #ffffff;
            outline: none;
            font-size: 14px;
        }

        input::placeholder {
            color: #626979;
        }

        input:focus,
        select:focus {
            border-color: #7c5cff;
            box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.12);
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #11131a;
            color: #ffffff;
        }

        .password-note {
            color: #7f8798;
            font-size: 12px;
            margin-top: 6px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 11px;
            padding: 14px;
            background: #7c5cff;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.2s ease;
        }

        button:hover {
            background: #6947f5;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 17px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.10);
            border: 1px solid rgba(34, 197, 94, 0.30);
            color: #86efac;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.30);
            color: #fca5a5;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #8f96a8;
            font-size: 14px;
        }

        .login-link a {
            color: #a896ff;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .required {
            color: #a896ff;
        }

        @media (max-width: 520px) {
            body {
                padding: 20px 14px;
            }

            .card {
                padding: 24px 20px;
            }

            .brand h1 {
                font-size: 26px;
            }

            .card h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="brand">
        <h1>Resume<span>Forge</span></h1>
    </div>

    <div class="card">

        <h2>Create your free account</h2>

        <p class="subtitle">
            Create an account to build, save and manage your resumes.
        </p>

        <div class="free-box">
            <strong>✓ Free at every level</strong><br>
            No payment required to create your account or build your resume.
        </div>

        <form id="signupForm">

            <!-- Full Name -->
            <div class="form-group">
                <label for="name">
                    Full Name <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <!-- Mobile -->
            <div class="form-group">
                <label for="mobile">
                    Mobile Number <span class="required">*</span>
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter your mobile number"
                    autocomplete="tel"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">
                    Email Address <span class="required">*</span>
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >
            </div>

            <!-- Highest Qualification -->
            <div class="form-group">
                <label for="qualification">
                    Highest Qualification <span class="required">*</span>
                </label>

                <select id="qualification" required>
                    <option value="">Select your highest qualification</option>
                    <option value="10th">10th</option>
                    <option value="12th">12th</option>
                    <option value="Diploma">Diploma</option>
                    <option value="B.Tech / B.E">B.Tech / B.E</option>
                    <option value="B.Sc">B.Sc</option>
                    <option value="B.Com">B.Com</option>
                    <option value="BBA">BBA</option>
                    <option value="BCA">BCA</option>
                    <option value="M.Tech / M.E">M.Tech / M.E</option>
                    <option value="M.Sc">M.Sc</option>
                    <option value="M.Com">M.Com</option>
                    <option value="MBA">MBA</option>
                    <option value="MCA">MCA</option>
                    <option value="PhD">PhD</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">
                    Password <span class="required">*</span>
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <div class="password-note">
                    Password must contain at least 6 characters.
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">
                    Confirm Password <span class="required">*</span>
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" id="signupButton">
                Create Free Account
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Log in</a>
        </div>

    </div>

</div>


<!-- Supabase JavaScript library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ResumeForge Supabase configuration -->
<script src="supabase-config.js"></script>


<script>
    const signupForm = document.getElementById("signupForm");
    const signupButton = document.getElementById("signupButton");
    const message = document.getElementById("message");

    signupForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const mobile = document.getElementById("mobile").value.trim();
        const email = document.getElementById("email").value.trim();
        const qualification = document.getElementById("qualification").value;
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        message.className = "message";
        message.textContent = "";

        /* Check password */
        if (password !== confirmPassword) {
            message.className = "message error";
            message.textContent = "Passwords do not match.";
            return;
        }

        /* Check password length */
        if (password.length < 6) {
            message.className = "message error";
            message.textContent =
                "Password must contain at least 6 characters.";
            return;
        }

        signupButton.disabled = true;
        signupButton.textContent = "Creating account...";

        try {

            /*
             * Create the real Supabase account.
             *
             * After email verification, Supabase will redirect
             * the user to the ResumeForge login page.
             */
            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        emailRedirectTo:
                            window.location.origin + "/login.html",

                        data: {
                            name: name,
                            mobile: mobile,
                            highest_qualification: qualification
                        }
                    }
                });

            if (error) {
                throw error;
            }

            /*
             * Supabase normally requires email verification.
             * When there is no session, the user must verify
             * their email before logging in.
             */
            if (data.user && !data.session) {

                message.className = "message success";

                message.textContent =
                    "Account created successfully! " +
                    "Please check your email and click the " +
                    "verification link. After verification, " +
                    "you will be taken to the login page.";

            } else {

                message.className = "message success";

                message.textContent =
                    "Account created successfully! " +
                    "Redirecting to your resume builder...";

                setTimeout(function () {

                    window.location.href = "builder.html";

                }, 1200);
            }

            signupForm.reset();

        } catch (error) {

            console.error("Signup error:", error);

            message.className = "message error";

            message.textContent =
                error.message ||
                "Unable to create your account.";

        } finally {

            signupButton.disabled = false;
            signupButton.textContent = "Create Free Account";
        }
    });
</script>

</body>
</html>
